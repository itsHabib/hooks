name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: bats + live-corpus smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hooks
        uses: actions/checkout@v4
        with:
          path: hooks

      - name: Checkout dossier (sibling)
        uses: actions/checkout@v4
        with:
          repository: itsHabib/dossier
          path: dossier
          fetch-depth: 1
          # itsHabib/dossier is a private repo; the default GITHUB_TOKEN
          # only has access to the current repo. DOSSIER_CHECKOUT_TOKEN is
          # a fine-grained PAT with read access to itsHabib/dossier,
          # configured in itsHabib/hooks repo secrets.
          token: ${{ secrets.DOSSIER_CHECKOUT_TOKEN }}
          # PR-controlled code (make test / make smoke) runs later in this
          # workflow; without this, actions/checkout persists the PAT in
          # the sibling repo's .git/config where untrusted PR code could
          # exfiltrate it. We only need the PAT for the checkout itself —
          # no later step pushes back or re-fetches.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + dossier target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dossier/target
          key: ${{ runner.os }}-cargo-dossier-${{ hashFiles('dossier/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dossier-

      - name: Build dossier (release)
        run: cargo build --release --manifest-path dossier/Cargo.toml

      # jq is pre-installed on ubuntu-latest runner images; no explicit
      # install step needed.

      - name: bats (mock-based unit tests)
        working-directory: hooks
        run: make test

      - name: live-corpus smoke (real dossier)
        working-directory: hooks
        env:
          DOSSIER_BIN: ${{ github.workspace }}/dossier/target/release/dossier
        run: make smoke
