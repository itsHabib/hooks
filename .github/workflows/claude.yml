name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Claude publishes its review as a formal review
      issues: read # unchanged: nothing here runs an issue-write command
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the action's tag-mode diff (git hash-object) needs
          # PR-branch blobs that a depth-1 checkout of main lacks, so a shallow
          # fetch kills @claude review on any PR that adds files.
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read

          # Gate counts a reviewer only when it finds a formal GitHub review
          # pinned to the exact judged head: classifyPanel in workbench's
          # cmd/gate/internal/evidence/panel.go requires User.Type=Bot, a
          # COMMENTED/APPROVED/CHANGES_REQUESTED state, and commit_id == head.
          # An issue comment satisfies none of that, so every PR here parked on
          # `missing=[claude]` while a thorough review sat right there in the
          # thread — and readiness escalated alongside it for want of any
          # review decision. codex only escapes this through a bespoke
          # comment-regex exemption; claude has no such carve-out.
          #
          # claude[bot] already satisfies the bot-identity and name matching,
          # so publishing the review AS a review is the whole fix. Appended to
          # the system prompt rather than set as `prompt`, so `@claude <any
          # other request>` keeps behaving exactly as before.
          #
          # Ported from itsHabib/workbench#199. Note this cannot be exercised
          # from a PR branch: issue_comment always runs the workflow file from
          # the default branch, so it takes effect only once merged.
          #
          # The allowlist is NOT the enforcement boundary for "never approve".
          # `Bash(gh pr review:*)` is a prefix wildcard — it admits --approve
          # exactly as readily as --comment, and the flag sits after the PR
          # number, so no prefix pattern can exclude it. Only the appended
          # prompt sentence stops an approval, and a review reads untrusted
          # input (PR body, diff) with that instruction in context.
          #
          # Accepted deliberately, because an approval buys nothing here: this
          # repo has no rulesets, so no required-approval rule exists for a bot
          # approval to satisfy, and gate's classifyPanel counts COMMENTED,
          # APPROVED and CHANGES_REQUESTED identically — an approval earns no
          # more panel credit than a comment. Revisit if this repo ever gains
          # branch protection requiring approving reviews; at that point the
          # gap becomes real and needs a tool-level control, not a sentence.
          #
          # --allowed-tools here is MERGED with the action's own options, not
          # a replacement: base-action/src/parse-sdk-options.ts builds
          # `[...new Set([...extraArgsAllowedTools, ...directAllowedTools])]`.
          # Adding this entry cannot strip the action's baseline tooling.
          claude_args: >-
            --allowed-tools "Bash(gh pr review:*)"
            --append-system-prompt
            "When you are asked to review a pull request, publish the review as
            a formal GitHub review pinned to the head commit you actually
            reviewed: gh pr review <number> --repo <owner/repo> --comment
            --body <your review>. Publish it as a review, not as an issue
            comment, and state the head SHA you reviewed in the body. Use
            --request-changes rather than --comment only when you found a
            blocking defect; never approve. If the review command fails, say so
            plainly instead of silently falling back to a comment."
